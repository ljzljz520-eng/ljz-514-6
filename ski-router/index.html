<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云岭国际滑雪场 · 智能雪道推荐</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🎿 云岭国际滑雪场</div>
  <div class="subtitle">智能雪道路线推荐</div>
  <div class="snow-info" id="snowInfo"></div>
</header>

<main class="layout">
  <aside class="panel">
    <h2>出行设置</h2>

    <div class="field">
      <label>① 所在缆车</label>
      <select id="liftSelect"></select>
      <p class="hint">路线首段为乘坐该缆车上山</p>
    </div>

    <div class="field">
      <label>② 我的水平</label>
      <div id="skillRadios" class="skill-list"></div>
      <p class="hint">系统不会安排超过所选水平的雪道</p>
    </div>

    <div class="field">
      <label>③ 推荐偏好</label>
      <select id="modeSelect">
        <option value="balanced">综合推荐（时间 / 拥挤 / 难度均衡）</option>
        <option value="shortest">距离最短</option>
        <option value="avoidCrowd">避开拥挤</option>
        <option value="easiest">难度最缓</option>
      </select>
    </div>

    <div class="field">
      <label>④ 想去的雪道 <span class="muted">（关闭雪道不参与计算）</span></label>
      <div id="slopeChecks" class="check-list"></div>
    </div>

    <div class="field">
      <label>⑤ 想去的休息站</label>
      <div id="restChecks" class="check-list"></div>
    </div>

    <button id="planBtn" class="plan-btn">⛷️ 生成推荐路线</button>
    <div id="warnings" class="warnings"></div>
  </aside>

  <section class="main-col">
    <div class="map-card">
      <div class="map-head">
        <h2>雪场地图</h2>
        <div class="legend" id="legend"></div>
      </div>
      <svg id="map" viewBox="0 0 800 560" role="img" aria-label="雪场地图"></svg>
    </div>

    <div class="result-card" id="resultCard">
      <h2>推荐路线 <span class="muted" id="routeSub"></span></h2>
      <div id="summary" class="summary"></div>
      <ol id="timeline" class="timeline"></ol>
      <p class="placeholder" id="placeholder">完成左侧设置后，点击「生成推荐路线」。</p>
    </div>
  </section>
</main>

<footer>数据为演示用模拟雪况 · 关闭雪道已自动排除 · 请遵守雪场安全规定，量力而行</footer>

<script src="js/data.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
</body>
</html>
